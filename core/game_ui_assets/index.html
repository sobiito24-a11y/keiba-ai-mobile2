<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script>
window.addEventListener('message',event=>{
 if(event.source!==window.parent || event.data.type!=='streamlit:render')return;
 const html=event.data.args.html;
 if(window.lastDocument===html)return;
 window.lastDocument=html;
 if(window.gameResizeObserver)window.gameResizeObserver.disconnect();
 const doc=new DOMParser().parseFromString(html,'text/html');
 document.head.querySelectorAll('style').forEach(x=>x.remove());
 doc.querySelectorAll('style').forEach(x=>document.head.appendChild(x.cloneNode(true)));
 document.body.innerHTML=doc.body.innerHTML;
 const source=document.body.querySelector('script:not([type])');
 if(source){const script=document.createElement('script');script.textContent=source.textContent;source.remove();document.body.appendChild(script);}
});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></body></html>
